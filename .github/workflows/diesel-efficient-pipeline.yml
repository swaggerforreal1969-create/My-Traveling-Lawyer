name: Diesel staged efficient CI (isolated, no new services)
on:
  push:
    branches:
      - diesel/mtl-efficient-pipeline-20261112
    paths:
      - .github/workflows/diesel-efficient-pipeline.yml
      - tools/diesel_ci_preflight.py
      - tests/test_diesel_ci_preflight.py
      - docs/DIESEL_CUSTOMER_QUEUE.json
      - docs/DIESEL_EFFICIENCY_WORKFLOW.md
      - tools/windows_fictional_gui.py
      - tools/build_signed_windows.ps1
      - src/offline_pilot.py
      - src/fictional_pilot_backup.py
      - tools/windows_native_backup_restore_acceptance.py
      - tools/windows_frozen_recovery_acceptance.py
      - tools/windows_dialog_probe.py
      - tests/test_windows_driver_expert_gate.py
      - native_windows_tests/**
permissions:
  contents: read
concurrency:
  group: mtl-efficient-${{ github.ref }}
  cancel-in-progress: true
jobs:
  low-cost-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      windows_required: ${{ steps.plan.outputs.windows_required }}
      source_changed: ${{ steps.plan.outputs.source_changed }}
      security_state: ${{ steps.plan.outputs.security_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deterministic preflight before expensive runner
        shell: bash
        run: python -m unittest discover -s tests -p test_diesel_ci_preflight.py -v
      - name: Assess exact SHA, scoped changed files, restricted source, and customer queue
        id: plan
        shell: bash
        run: |
          python -m tools.diesel_ci_preflight --out "${{ runner.temp }}/diesel-efficiency-proof.json"
      - name: Retain one compact plan without credentials or unsigned EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diesel-efficiency-preflight
          path: ${{ runner.temp }}/diesel-efficiency-proof.json
          retention-days: 7
          if-no-files-found: warn
  expert-driver-triage:
    needs: low-cost-preflight
    if: needs.low-cost-preflight.outputs.windows_required == 'true' && needs.low-cost-preflight.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject known Windows black-box driver defects before building
        run: python -m unittest discover -s tests -p test_windows_driver_expert_gate.py -v
  windows-on-change-only:
    needs: [low-cost-preflight, expert-driver-triage]
    if: needs.low-cost-preflight.outputs.windows_required == 'true' && needs.low-cost-preflight.outputs.source_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows real native customer recovery check when related source changes
        shell: pwsh
        run: |
          python -m tools.windows_native_backup_restore_acceptance
          if ($LASTEXITCODE -ne 0) { throw "ACTUAL_RECOVERY_DENIED" }
      - name: Verify actual Windows customer help, backup, restore and startup contracts
        shell: pwsh
        run: |
          foreach ($suite in @("test_windows_practice_help.py", "test_windows_backup_ui.py", "test_windows_restore_ui.py", "test_windows_build_candidate.py")) {
            python -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { throw "WINDOWS_CUSTOMER_CONTRACT_DENIED:$suite" }
          }
      - name: Build frozen EXE once after native acceptance
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "BUILD_TOOL_DENIED" }
          ./tools/build_signed_windows.ps1 -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "FROZEN_BUILD_DENIED" }
      - name: Expert frozen-dialog discovery (bounded, no blind full retry)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_UI_DRIVER_INSTALL_DENIED" }
          python -m tools.windows_dialog_probe
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_DIALOG_PROBE_FAILED" }
      - name: Retain sanitized dialog metadata, never access codes or EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-dialog-diagnostic-only
          path: frozen-dialog-diagnostic.json
          retention-days: 3
          if-no-files-found: warn
      # Full black-box test is intentionally paused until its file-picker
      # identity is established. No false customer acceptance.
      - name: Verify exact-source package and native window, no signing claims
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $exe=(Resolve-Path "dist/MyTravelingLawyer-Practice/MyTravelingLawyer-Practice.exe").Path
          $toc=Get-Content "build/MyTravelingLawyer-Practice/Analysis-00.toc" -Raw
          foreach ($module in @("src.local_operator_gui","src.fictional_pilot_backup")) {
            if ($toc -notmatch [regex]::Escape($module)) { throw "FROZEN_DEPENDENCY_MISSING" }
          }
          if ((Get-AuthenticodeSignature $exe).Status -ne "NotSigned") { throw "SIGNATURE_STATE_UNEXPECTED" }
          $p=Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited -or $p.MainWindowHandle -eq 0) { throw "FROZEN_STARTUP_DENIED" }
            Write-Output "EXACT_SHA=$env:GITHUB_SHA"
            Write-Output "EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
            Write-Output "FROZEN_GUI=OPENED"
            Write-Output "AUTHENTICODE=NOT_SIGNED"
            Write-Output "SMART_APP_CONTROL=UNRESOLVED"
          } finally {
            if (!$p.HasExited) {
              [void]$p.CloseMainWindow()
              if (!$p.WaitForExit(5000)) { Stop-Process -Id $p.Id -Force }
            }
          }
