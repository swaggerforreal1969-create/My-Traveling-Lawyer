name: My Traveling Lawyer focused backup UI acceptance (no release)
on:
  push:
    branches:
      - diesel/mtl-customer-backup-ui-20261112
    paths:
      - tools/windows_fictional_gui.py
      - tests/test_windows_backup_ui.py
      - tests/test_windows_restore_ui.py
      - .github/workflows/diesel-windows-backup-ui.yml
permissions:
  contents: read
jobs:
  focused-native-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New backup button and nonmutation acceptance
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_windows_backup_ui.py -v
          if ($LASTEXITCODE -ne 0) { throw "BACKUP_GUI_DENIED" }
          python -m unittest discover -s tests -p test_windows_practice_help.py -v
          if ($LASTEXITCODE -ne 0) { throw "ONBOARDING_REGRESSION" }
          python -m unittest discover -s tests -p test_windows_build_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw "STARTUP_REGRESSION" }
          python -m unittest discover -s tests -p test_windows_restore_ui.py -v
          if ($LASTEXITCODE -ne 0) { throw "RESTORE_GUI_DENIED" }
      - name: Compile changed startup code and preserve explicit frozen dependency
        shell: pwsh
        run: |
          python -m py_compile tools/windows_fictional_gui.py
          if ($LASTEXITCODE -ne 0) { throw "STARTUP_SYNTAX_DENIED" }
          python -c "import tools.windows_fictional_gui as g; assert callable(g.backup_case)"
