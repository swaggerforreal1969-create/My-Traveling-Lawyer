name: MTL PR110 independent-process authorization race probes
on:
  push:
    branches:
      - engineering/security-write-admission-audit-20261110
permissions:
  contents: read
jobs:
  linux-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm exact source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_SHA_VERIFIED=$actual"
      - name: V2 pinned custody transport trust validation
        run: python -m unittest discover -s tests -p test_v2_custody_transport.py -v
      - name: Offline pinned HTTPS v2 integration tests
        run: python -m unittest discover -s tests -p test_pinned_https_custody_adapter.py -v
      - name: Independent-process authorization race tests
        run: python -m unittest discover -s tests -p test_security_independent_process_gate.py -v
      - name: Existing secure engine regressions
        run: python -m unittest discover -s tests -p test_secure_engine.py -v
      - name: Existing secure HTTP regressions
        run: python -m unittest discover -s tests -p test_secure_http.py -v
      - name: Source manifest gate unit tests
        if: always()
        run: python -m unittest discover -s tests -p test_source_manifest_gate.py -v
      - name: Restricted-source audit fixture tests
        if: always()
        run: python -m unittest discover -s tests -p test_offline_restricted_source_audit.py -v
  windows-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "EXACT_SHA_MISMATCH" }
          Write-Output "EXACT_SHA_VERIFIED=$actual"
      - name: V2 pinned custody transport trust validation
        run: python -m unittest discover -s tests -p test_v2_custody_transport.py -v
      - name: Offline pinned HTTPS v2 integration tests
        run: python -m unittest discover -s tests -p test_pinned_https_custody_adapter.py -v
      - name: Independent-process authorization race tests
        run: python -m unittest discover -s tests -p test_security_independent_process_gate.py -v
      - name: Existing secure engine regressions
        run: python -m unittest discover -s tests -p test_secure_engine.py -v
      - name: Existing secure HTTP regressions
        run: python -m unittest discover -s tests -p test_secure_http.py -v
      - name: Source manifest gate unit tests
        if: always()
        run: python -m unittest discover -s tests -p test_source_manifest_gate.py -v
      - name: Restricted-source audit fixture tests
        if: always()
        run: python -m unittest discover -s tests -p test_offline_restricted_source_audit.py -v
