name: MTL PR95 local-only Semgrep source review
on:
  push:
    branches:
      - engineering/pr95-zero-cost-semgrep-zap-guardrails-20261110
  pull_request:
    branches:
      - engineering/pr94-atomic-attorney-writes-20261110
permissions:
  contents: read
jobs:
  local-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm source is the intended candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_SHA_VERIFIED=$EXPECTED_SHA"
      - name: Install local open-source Semgrep CLI
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Check Semgrep rules and scan only allowed source, no cloud upload
        shell: bash
        run: |
          semgrep scan --config security/semgrep-local.yml --metrics off --disable-version-check --json --output "$RUNNER_TEMP/mtl-semgrep.json" src
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path
          report=Path(os.environ["RUNNER_TEMP"])/"mtl-semgrep.json"
          data=json.loads(report.read_text(encoding="utf-8"))
          findings=data.get("results", [])
          errors=data.get("errors", [])
          print("SEMGREP_LOCAL_RESULT_COUNT=" + str(len(findings)))
          print("SEMGREP_RULE_COUNTS=" + json.dumps(dict(sorted(Counter(x.get("check_id","unknown") for x in findings).items()))))
          print("SEMGREP_SCAN_ERRORS=" + str(len(errors)))
          # Do not print source excerpts, findings' extra metadata, tokens, or private text.
          if errors:
              raise SystemExit("SEMGREP_CONFIG_OR_SCAN_FAILED")
          print("SEMGREP_FINDINGS_REQUIRE_REPRODUCTION_NOT_AUTOMATIC_SECURITY_ACCEPTANCE")
          PY
