name: MTL native real backup restore + frozen EXE acceptance (one-shot)
on:
  push:
    branches:
      - diesel/mtl-customer-backup-ui-20261112
    paths:
      - tools/windows_native_backup_restore_acceptance.py
      - .github/workflows/diesel-native-recovery-acceptance.yml
permissions:
  contents: read
concurrency:
  group: mtl-diesel-native-recovery-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-recovery-then-frozen-build:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute real Windows Tk backup restore using real backend
        shell: pwsh
        run: |
          python -m tools.windows_native_backup_restore_acceptance
          if ($LASTEXITCODE -ne 0) { throw "REAL_RECOVERY_JOURNEY_DENIED" }
      - name: Build this exact source commit into one unsigned native Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "BUILD_DEPENDENCY_DENIED" }
          ./tools/build_signed_windows.ps1 -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "FROZEN_BUILD_DENIED" }
      - name: Verify actual packaged startup and confidential boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $exe=(Resolve-Path "dist/MyTravelingLawyer-Practice/MyTravelingLawyer-Practice.exe").Path
          $signature=(Get-AuthenticodeSignature $exe).Status
          if ($signature -ne "NotSigned") { throw "UNEXPECTED_SIGNATURE_STATUS" }
          $toc=Get-Content "build/MyTravelingLawyer-Practice/Analysis-00.toc" -Raw
          foreach ($dependency in @("src.local_operator_gui","src.fictional_pilot_backup")) {
            if ($toc -notmatch [regex]::Escape($dependency)) { throw "FROZEN_DEPENDENCY_MISSING" }
          }
          $process=Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited -or $process.MainWindowHandle -eq 0) { throw "FROZEN_APP_STARTUP_DENIED" }
            Write-Output "EXACT_SHA=$env:GITHUB_SHA"
            Write-Output "EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
            Write-Output "WINDOW_OPENED=YES"
            Write-Output "BACKUP_RESTORE_MODULE_BUNDLED=YES"
            Write-Output "AUTHENTICODE=NotSigned"
            Write-Output "SAC=UNRESOLVED"
          } finally {
            if (!$process.HasExited) {
              [void]$process.CloseMainWindow()
              if (!$process.WaitForExit(5000)) { Stop-Process -Id $process.Id -Force }
            }
          }
